services:
  api:
    build:
      context: ..
      dockerfile: toolgate/Dockerfile
    container_name: toolgate-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      - ./:/app/toolgate
      # The vault key lives on its own volume, never in the bind-mounted source
      # directory: a copy of that directory must not carry the key that
      # decrypts the values inside it.
      - toolgate-vault:/var/lib/toolgate
    environment:
      TOOLGATE_VAULT_KEY_FILE: /var/lib/toolgate/vault.key
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default
      - memorygate

  dashboard:
    build:
      context: ../dashboard
    container_name: toolgate-dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:8011:8011"

  searxng:
    image: searxng/searxng@sha256:b8ca38ba06eea544d7555e88321e212ddc0d5c3c7de055419cfb2e5c6bf30812
    container_name: toolgate-searxng
    restart: unless-stopped
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      default:
        aliases:
          - toolgate-searxng
      memorygate:
        aliases:
          - searxng
          - toolgate-searxng

volumes:
  toolgate-vault:

networks:
  memorygate:
    external: true
    name: conker_net
